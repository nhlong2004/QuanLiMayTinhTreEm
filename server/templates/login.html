<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenGuardKids - Đăng Nhập & Đăng Ký</title>

    <!-- Google Fonts theo phong cách Orange Charming -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Edu+QLD+Hand:wght@400..700&family=Itim&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg-color: #0e1118;
            --card-bg: rgba(18, 20, 28, 0.78);
            --title-color: #faebd7;
            --accent-pink: #ffe4e1;
            --accent-orange: #ff9f43;
            --accent-green: #2ecc71;
            --text-color: #fffaf0;
            --text-muted: #cbd5e1;
            --border-glass: rgba(255, 228, 225, 0.18);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Itim', cursive, sans-serif;
            color: var(--text-color);
            background: linear-gradient(135deg, #181324 0%, #111424 50%, #171d26 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            background-attachment: fixed;
        }

        /* Backdrop hiệu ứng đốm sáng màu sắc */
        .backdrop {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 25%, rgba(255, 159, 67, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 75%, rgba(255, 107, 129, 0.15) 0%, transparent 45%);
            pointer-events: none;
            z-index: 0;
        }

        .auth-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 460px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 28px;
            padding: 36px 30px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.55);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .auth-logo {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            padding: 8px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 228, 225, 0.35);
            filter: drop-shadow(0 4px 12px rgba(255, 159, 67, 0.4));
            margin-bottom: 12px;
        }

        .auth-title {
            font-family: 'Amatic SC', cursive;
            font-size: 42px;
            font-weight: 700;
            color: var(--title-color);
            letter-spacing: 1px;
            line-height: 1;
        }

        .auth-desc {
            font-size: 15px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        /* Tabs chuyển đổi */
        .tabs-header {
            display: flex;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            margin-bottom: 22px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-family: 'Itim', cursive;
            font-size: 17px;
            font-weight: 600;
            color: var(--text-muted);
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .tab-btn:hover {
            color: #fff;
        }

        .tab-btn.active {
            color: #ffd8a8;
            border-bottom-color: var(--accent-orange);
            text-shadow: 0 0 12px rgba(255, 159, 67, 0.4);
        }

        /* Form elements */
        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            color: var(--accent-pink);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-input,
        .form-select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-glass);
            border-radius: 14px;
            color: #fff;
            font-family: 'Itim', cursive;
            font-size: 15px;
            outline: none;
            transition: all 0.25s ease;
        }

        .form-input:focus,
        .form-select:focus {
            border-color: var(--accent-orange);
            box-shadow: 0 0 14px rgba(255, 159, 67, 0.3);
            background: rgba(0, 0, 0, 0.55);
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #ff9f43 0%, #ee5253 100%);
            border: none;
            border-radius: 16px;
            color: #fff;
            font-family: 'Itim', cursive;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 14px rgba(255, 159, 67, 0.35);
            margin-top: 8px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(255, 159, 67, 0.5);
        }

        .alert-box {
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 14px;
            margin-bottom: 18px;
            text-align: center;
        }

        .alert-error {
            background: rgba(238, 82, 83, 0.2);
            color: #ff9f9f;
            border: 1px solid rgba(238, 82, 83, 0.4);
        }

        .alert-success {
            background: rgba(46, 204, 113, 0.2);
            color: #a8f0c6;
            border: 1px solid rgba(46, 204, 113, 0.4);
        }

        .demo-accounts {
            margin-top: 22px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
        }

        .demo-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.08);
            padding: 3px 8px;
            border-radius: 8px;
            color: #ffd8a8;
            font-family: monospace;
            margin: 2px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>
    <div class="backdrop"></div>

    <div class="auth-container">
        <div class="auth-header">
            <img src="/static/images/shield_logo.svg" alt="OpenGuardKids" class="auth-logo"
                onerror="this.src='/static/images/pic5.jpg'">
            <h1 class="auth-title">OpenGuardKids</h1>
            <p class="auth-desc">Đồng hành & bảo vệ việc sử dụng máy tính của con</p>
        </div>

        <!-- Tab chuyển đổi -->
        <div class="tabs-header">
            <button id="tab-login" onclick="switchTab('login')" class="tab-btn active">
                Đăng Nhập
            </button>
            <button id="tab-register" onclick="switchTab('register')" class="tab-btn">
                Đăng Ký
            </button>
        </div>

        <div id="alert-box" class="hidden alert-box"></div>

        <!-- Form Đăng Nhập -->
        <form id="login-form">
            <div class="form-group">
                <label class="form-label">Tên đăng nhập:</label>
                <input type="text" id="login-username" required placeholder="Nhập tên đăng nhập" class="form-input">
            </div>

            <div class="form-group">
                <label class="form-label">Mật khẩu:</label>
                <input type="password" id="login-password" required placeholder="••••••••" class="form-input">
            </div>

            <button type="submit" class="btn-submit">
                🚀 Đăng Nhập Ngay
            </button>
        </form>

        <!-- Form Đăng Ký -->
        <form id="register-form" class="hidden">
            <div class="form-group">
                <label class="form-label">Tên đăng nhập:</label>
                <input type="text" id="reg-username" required placeholder="Ví dụ: parent_hung hoặc be_minh"
                    class="form-input">
            </div>

            <div class="form-group">
                <label class="form-label">Mật khẩu (Từ 10 ký tự):</label>
                <input type="password" id="reg-password" required placeholder="••••••••" class="form-input">
            </div>

            <div class="form-group">
                <label class="form-label">Vai trò tài khoản:</label>
                <select id="reg-role" onchange="toggleChildNameInput()" class="form-select">
                    <option value="parent">Phụ huynh</option>
                    <option value="child">Trẻ em</option>
                </select>
            </div>

            <div id="child-name-container" class="form-group hidden">
                <label class="form-label">Tên thân mật của bé:</label>
                <input type="text" id="reg-child-name" placeholder="Ví dụ: Bé Minh" class="form-input">
            </div>

            <button type="submit" class="btn-submit"
                style="background: linear-gradient(135deg, #2ecc71 0%, #10b981 100%);">
                ✨ Đăng Ký Tài Khoản
            </button>
        </form>

        <!-- Màn hình Đăng Ký Thành Công -->
        <div id="register-success" class="hidden" style="text-align: center; padding: 12px 6px;">
            <div style="font-size: 54px; line-height: 1; margin-bottom: 12px;">🎉</div>
            <h3 style="font-family: 'Amatic SC', cursive; font-size: 34px; color: #a8f0c6; font-weight: 700; margin-bottom: 8px;">Đăng Ký Thành Công!</h3>
            <p id="success-desc" style="font-size: 15.5px; color: var(--text-color); margin-bottom: 22px; line-height: 1.5;"></p>
            <button type="button" onclick="goToLoginAfterRegister()" class="btn-submit" style="background: linear-gradient(135deg, #ff9f43 0%, #ee5253 100%); margin-bottom: 12px;">
                🚀 Chuyển Sang Đăng Nhập Ngay
            </button>
            <div>
                <button type="button" onclick="resetRegisterForm()" style="background: transparent; border: none; color: var(--text-muted); font-family: 'Itim', cursive; font-size: 14.5px; cursor: pointer; text-decoration: underline;">
                    + Đăng ký thêm tài khoản khác
                </button>
            </div>
        </div>
    </div>

    <script>
        let lastRegisteredUsername = '';

        function switchTab(tab) {
            const loginForm = document.getElementById('login-form');
            const regForm = document.getElementById('register-form');
            const regSuccess = document.getElementById('register-success');
            const tabLogin = document.getElementById('tab-login');
            const tabReg = document.getElementById('tab-register');
            const alertBox = document.getElementById('alert-box');
            alertBox.classList.add('hidden');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
                if (regSuccess) regSuccess.classList.add('hidden');
                tabLogin.classList.add('active');
                tabReg.classList.remove('active');
            } else {
                loginForm.classList.add('hidden');
                if (regSuccess && !regSuccess.classList.contains('hidden')) {
                    regForm.classList.add('hidden');
                } else {
                    regForm.classList.remove('hidden');
                    if (regSuccess) regSuccess.classList.add('hidden');
                }
                tabReg.classList.add('active');
                tabLogin.classList.remove('active');
            }
        }

        function goToLoginAfterRegister() {
            switchTab('login');
            if (lastRegisteredUsername) {
                const loginUser = document.getElementById('login-username');
                loginUser.value = lastRegisteredUsername;
                const loginPass = document.getElementById('login-password');
                loginPass.value = '';
                loginPass.focus();
            }
        }

        function resetRegisterForm() {
            document.getElementById('register-form').reset();
            toggleChildNameInput();
            document.getElementById('register-success').classList.add('hidden');
            document.getElementById('register-form').classList.remove('hidden');
            document.getElementById('alert-box').classList.add('hidden');
        }

        function toggleChildNameInput() {
            const role = document.getElementById('reg-role').value;
            const container = document.getElementById('child-name-container');
            if (role === 'child') {
                container.classList.remove('hidden');
            } else {
                container.classList.add('hidden');
            }
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value.trim();
            const alertBox = document.getElementById('alert-box');
            alertBox.classList.add('hidden');

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                if (response.ok) {
                    localStorage.clear();
                    localStorage.setItem('ogk_token', data.access_token);
                    localStorage.setItem('ogk_role', data.role);
                    localStorage.setItem('ogk_username', data.username || username);
                    if (data.child_name) {
                        localStorage.setItem('ogk_child_name', data.child_name);
                    }
                    window.location.href = data.redirect_url;
                } else {
                    alertBox.className = 'alert-box alert-error';
                    alertBox.textContent = data.detail || 'Đăng nhập thất bại!';
                    alertBox.classList.remove('hidden');
                }
            } catch (err) {
                alertBox.className = 'alert-box alert-error';
                alertBox.textContent = 'Không thể kết nối tới Server.';
                alertBox.classList.remove('hidden');
            }
        });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('reg-username').value.trim();
            const password = document.getElementById('reg-password').value.trim();
            const role = document.getElementById('reg-role').value;
            const child_name = document.getElementById('reg-child-name').value.trim();
            const alertBox = document.getElementById('alert-box');
            alertBox.classList.add('hidden');

            try {
                const response = await fetch('/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, role, child_name })
                });

                const data = await response.json();
                if (response.ok) {
                    alertBox.classList.add('hidden');
                    lastRegisteredUsername = username;
                    const roleLabel = role === 'parent' ? 'Phụ huynh' : 'Trẻ em';
                    const childDetail = (role === 'child' && child_name) ? ` (Bé: ${child_name})` : '';
                    document.getElementById('success-desc').innerHTML = `Tài khoản <strong>${username}</strong> (${roleLabel}${childDetail}) đã khởi tạo thành công!`;
                    document.getElementById('register-form').classList.add('hidden');
                    document.getElementById('register-success').classList.remove('hidden');
                } else {
                    alertBox.className = 'alert-box alert-error';
                    alertBox.textContent = data.detail || 'Đăng ký thất bại!';
                    alertBox.classList.remove('hidden');
                }
            } catch (err) {
                alertBox.className = 'alert-box alert-error';
                alertBox.textContent = 'Không thể kết nối tới Server.';
                alertBox.classList.remove('hidden');
            }
        });
    </script>
</body>

</html>
